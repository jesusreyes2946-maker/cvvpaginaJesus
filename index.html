<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículum Vitae - Jesús Enrique</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid #334155;
        }
        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .title-group p {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        .btn-download {
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .pdf-container {
            width: 100%;
            max-width: 900px;
            height: 82vh;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback-msg {
            padding: 2rem;
            text-align: center;
            color: #cbd5e1;
        }
        .fallback-msg a {
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Jesús Enrique</h1>
            <p>Ingeniería Mecatrónica — Currículum Vitae</p>
        </div>
        <!-- Asegúrate de que el nombre del archivo coincida exactamente con el PDF que subas -->
        <a href="Curriculum_Jesus.pdf" download="Curriculum_Jesus_Enrique.pdf" class="btn-download">
            Descargar PDF
        </a>
    </header>

    <main>
        <div class="pdf-container">
            <iframe src="Curriculum_Jesus.pdf#view=FitH" title="Currículum de Jesús Enrique">
                <div class="fallback-msg">
                    <p>Tu navegador no puede mostrar el PDF directamente.</p>
                    <p><a href="Curriculum_Jesus.pdf" download>Haz clic aquí para descargarlo.</a></p>
                </div>
            </iframe>
        </div>
    </main>

</body>
</html>
